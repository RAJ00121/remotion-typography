name: Render Remotion Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    name: Render Typography Video
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.5.2 --activate

      - name: Install system dependencies (FFmpeg & Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install Node packages
        run: pnpm install --no-frozen-lockfile

      - name: Render Remotion Video (Vertical 9:16)
        run: |
          mkdir -p out
          pnpm exec remotion render src/index.ts TypographyAnimation out/reflections_vertical.mp4 --concurrency=2

      - name: Render Remotion Video (Landscape 16:9)
        run: |
          pnpm exec remotion render src/index.ts TypographyAnimationLandscape out/reflections_landscape.mp4 --concurrency=2

      - name: Upload Rendered Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotion-rendered-videos
          path: out/*.mp4
          retention-days: 14
